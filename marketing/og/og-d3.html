<!doctype html>
<!--
  OG image source, candidate D3 — centered lockup over hero-2 (island with sun rays), radial scrim.
  Reversed emblem (dark-surface variant, over the scrim) + live-type wordmark in Poppins 600
  (close match to the approved raster face; approximation until the vector lands).
  Render: node ~/.claude-tools/screenshot/shot.mjs "file://$(pwd)/marketing/og/og-d.html" <out.png> 1200 630
-->
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; position: relative; }
  body { font-family: "Poppins", sans-serif; }
  .photo { position: absolute; inset: 0; width: 1200px; height: 630px; object-fit: cover; object-position: 50% 55%; }
  .scrim {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 980px 560px at 50% 50%, rgba(26,23,20,0.48) 0%, rgba(26,23,20,0.24) 55%, rgba(26,23,20,0.08) 100%);
  }
  .lockup {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .emblem { width: 150px; height: auto; object-fit: contain; margin-bottom: 24px; }
  .madrona { font-size: 124px; font-weight: 600; color: #fdfcfa; line-height: 1; letter-spacing: -0.005em; text-shadow: 0 2px 28px rgba(26,23,20,0.35); }
  .studio { font-size: 30px; font-weight: 300; color: #fdfcfa; letter-spacing: 0.4em; line-height: 1; opacity: 0.95; }
</style>
</head>
<body>
  <img class="photo" src="../../docs/madrona-v2-build-kit/site-assets/hero-2.webp" />
  <div class="scrim"></div>
  <div class="lockup">
    <img class="emblem" src="../../docs/madrona_static_logo_assets/madrona-approved-emblem-reversed-transparent.png" />
    <div class="madrona">madrona</div>
    <div class="studio">product studio</div>
  </div>
</body>
</html>
