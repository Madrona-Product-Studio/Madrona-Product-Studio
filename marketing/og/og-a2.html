<!doctype html>
<!--
  OG image source, candidate A2 — approved horizontal logo on warm paper.
  Uses docs/madrona_static_logo_assets (approved raster system; transparent variant on very light neutral only).
  Native asset is 1138x400 — CSS width capped at 569px so the 2x render never upscales it.
  Render: node ~/.claude-tools/screenshot/shot.mjs "file://$(pwd)/marketing/og/og-a2.html" <out.png> 1200 630
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f5f1ea; display: grid; place-items: center; } /* site bg, very light warm neutral */
  img { width: 569px; height: auto; object-fit: contain; }
</style>
</head>
<body>
  <img src="../../docs/madrona_static_logo_assets/madrona-approved-logo-transparent.png" />
</body>
</html>
