    <script>
      // Sky state before first paint — no light flash for night visitors.
      // Mirror of src/lib/theme.ts (the full engine takes over on boot).
      (function () {
        try {
          var p = new URLSearchParams(location.search).get("theme");
          var pref = p || localStorage.getItem("madrona-theme") || "auto";
          var state = pref;
          if (pref !== "day" && pref !== "dusk" && pref !== "night") {
            var d = new Date(), rad = Math.PI / 180, lat = 48.7491, lon = -122.4787;
            var doy = Math.floor((d.getTime() - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5);
            var g = 2 * Math.PI / 365 * (doy - 1);
            var eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
            var de = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
            var ha = Math.acos(Math.cos(90.833 * rad) / (Math.cos(lat * rad) * Math.cos(de)) - Math.tan(lat * rad) * Math.tan(de)) / rad;
            var rise = 720 - 4 * (lon + ha) - eq, sset = 720 - 4 * (lon - ha) - eq;
            // Evening `sset` runs past 24h UTC; check raw minutes and the +24h alias.
            var raw = d.getUTCHours() * 60 + d.getUTCMinutes();
            state = "night";
            for (var k = 0; k < 2; k++) {
              var t = raw + k * 1440;
              if (Math.abs(t - rise) <= 40 || Math.abs(t - sset) <= 40) { state = "dusk"; break; }
              if (t > rise && t < sset) { state = "day"; break; }
            }
          }
          document.documentElement.dataset.theme = state;
        } catch (e) { document.documentElement.dataset.theme = "day"; }
      })();
    </script>
