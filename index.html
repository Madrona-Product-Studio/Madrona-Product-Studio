    <!-- Enable scroll-reveal only when JS runs and motion is allowed. Runs before
         paint so prerendered content is never hidden for no-JS / crawlers. -->
    <script>
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.classList.add("js-reveal");
      }
    </script>
    <title>Madrona Product Studio · Bellingham, Washington</title>
    <meta name="description" content="A small, senior product studio in Bellingham, Washington. We help companies figure out what to build, then build it. Every engagement starts with a free 30-minute conversation." />
